Client:
    type: object
    config:
        description: "A client of the company."
        fields:
            id:
                type: "Int!"
            name:
                type: "String!"
            pib:
                type: "Int!"
            mbr:
                type: "Int!"
            servicesPrice:
                type: "String"
            status:
                type: "ClientStatus!"
            dedicatedEmployee:
                type: "User"
                resolve: "@=service('user_loader').load(value.getDedicatedEmployee().getId())"
            invoices:
                type: "[Invoice!]!"
                resolve: "@=service('client_invoices_loader').load(value.getId())"


ClientStatus:
    type: enum
    config:
        description: "Status of the companies client."
        enumClass: "App\\Enum\\ClientStatus"
